<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa Interactivo de Arica</title>

   <!-- Libreria laflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Diseño de la pagina, letras y botones -->
    <style> 
      body {
        background-image: linear-gradient(rgba(22, 21, 21, 0.8), rgba(22, 21, 21, 0.8)), 
                      url('https://www.tipicochileno.cl/wp-content/uploads/2011/08/El-morro-de-Arica-L.png'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        padding: 20px;
      }
      #map {
        height: 800px;
        width: 100%;
        border: 2px solid #ccc;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #d6d5d5;
        text-align: center;
      }

      
    </style>
  </head>
  <body>
    <h1>WayNorte: Turismo, Micros y Reciclaje</h1>

  
    <div id="map"></div>

    <script>
    
      var map = L.map("map").setView([-18.478, -70.312], 14);

     
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      var iconoVerde = new L.Icon({
        iconUrl:
          "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png",
        shadowUrl:
          "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41],
      });

      // Puntos de reciclaje

      var sodimac = L.marker([-18.459913279501265, -70.29623940841562], ).addTo(
        map,);
      sodimac.bindPopup("Sodimac Arica<br>Punto de reciclaje");

      // Puntos de interes turistico

      var playaChinchorro = L.marker([-18.462670866239254, -70.3048533276622]).addTo(
        map,);
      playaChinchorro.bindPopup("Playa Chinchorro<br>Punto Turistico")

    </script>
  </body>
</html>
